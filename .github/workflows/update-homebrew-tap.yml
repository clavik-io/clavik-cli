# Updates the Homebrew formula in clavik-io/homebrew-tap whenever a release is
# published here.
#
# It reacts to a release rather than to a bare tag push, because this repository
# holds no source: there is nothing here to build, and a tag with no assets
# behind it would produce a formula pointing at downloads that do not exist.
# The release, with its binaries attached, is the real event.
name: Update Homebrew tap

on:
  release:
    types: [published]
  # For re-running against an existing release: a failed push, a tap repo that
  # was not writable yet, or a formula that needs regenerating.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to the tap (e.g. v1.0.0)"
        required: true

permissions:
  contents: read

jobs:
  update-tap:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the release tag
        id: rel
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${TAG}" ]; then
            echo "::error::No tag resolved from the event or the input."
            exit 1
          fi
          # v1.2.3 -> 1.2.3. Homebrew's `version` is the bare number; the tag
          # keeps its v prefix for the download URLs.
          VERSION="${TAG#v}"
          if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Tag '${TAG}' is not a semver release tag; refusing to build a formula from it."
            exit 1
          fi
          echo "tag=${TAG}"         >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download the release assets and VERIFY them
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p assets && cd assets
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --clobber

          # Every platform the formula covers must be present. A release missing
          # one would otherwise produce a formula that 404s for those users only,
          # which is the kind of break nobody notices until someone reports it.
          for f in darwin_arm64 darwin_amd64 linux_arm64 linux_amd64; do
            test -f "clavik_${TAG}_${f}" || { echo "::error::missing asset clavik_${TAG}_${f}"; exit 1; }
          done
          test -f checksums.txt || { echo "::error::release has no checksums.txt"; exit 1; }

          # Verify the published checksums against the published binaries rather
          # than trusting the file. If they disagree, the release is wrong and a
          # formula built from it would make every user's `brew install` fail
          # its sha256 check — better to stop here.
          sha256sum -c checksums.txt --ignore-missing
          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Check out the tap
        uses: actions/checkout@v4
        with:
          repository: clavik-io/homebrew-tap
          # A PAT (or GitHub App token) with contents:write on homebrew-tap.
          # The default GITHUB_TOKEN cannot write to another repository.
          token: ${{ secrets.TAP_TOKEN }}
          path: tap

      - name: Render the formula
        env:
          TAG: ${{ steps.rel.outputs.tag }}
          VERSION: ${{ steps.rel.outputs.version }}
        run: |
          set -euo pipefail
          sha() { grep " clavik_${TAG}_$1\$" assets/checksums.txt | cut -d' ' -f1; }
          DARWIN_ARM="$(sha darwin_arm64)"; DARWIN_AMD="$(sha darwin_amd64)"
          LINUX_ARM="$(sha linux_arm64)";   LINUX_AMD="$(sha linux_amd64)"
          for v in "$DARWIN_ARM" "$DARWIN_AMD" "$LINUX_ARM" "$LINUX_AMD"; do
            test -n "$v" || { echo "::error::a checksum was empty; checksums.txt does not match the asset names"; exit 1; }
          done

          cat > tap/Formula/clavik.rb <<EOF
          # Binary formula: the clavik source is not published, so this installs
          # the released binary rather than building from source.
          #
          # Generated by .github/workflows/update-homebrew-tap.yml in
          # clavik-io/clavik-cli. Edit that workflow, not this file — a release
          # will overwrite anything changed here by hand.
          class Clavik < Formula
            desc "Command-line client for the Clavik vault"
            homepage "https://clavik.io"
            version "${VERSION}"
            license "Apache-2.0"

            on_macos do
              on_arm do
                url "https://github.com/clavik-io/clavik-cli/releases/download/v#{version}/clavik_v#{version}_darwin_arm64"
                sha256 "${DARWIN_ARM}"
              end
              on_intel do
                url "https://github.com/clavik-io/clavik-cli/releases/download/v#{version}/clavik_v#{version}_darwin_amd64"
                sha256 "${DARWIN_AMD}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/clavik-io/clavik-cli/releases/download/v#{version}/clavik_v#{version}_linux_arm64"
                sha256 "${LINUX_ARM}"
              end
              on_intel do
                url "https://github.com/clavik-io/clavik-cli/releases/download/v#{version}/clavik_v#{version}_linux_amd64"
                sha256 "${LINUX_AMD}"
              end
            end

            def install
              # The release asset is the bare executable, named per platform.
              # Install it under the plain name users type.
              bin.install Dir["clavik_*"].first => "clavik"
            end

            test do
              assert_match "v#{version}", shell_output("#{bin}/clavik version")
              assert_match "clavik", shell_output("#{bin}/clavik --help")
            end
          end
          EOF

      - name: Commit and push the formula
        env:
          TAG: ${{ steps.rel.outputs.tag }}
          VERSION: ${{ steps.rel.outputs.version }}
        working-directory: tap
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/clavik.rb; then
            echo "Formula already matches ${TAG}; nothing to push."
            exit 0
          fi
          git config user.name  "clavik-release-bot"
          git config user.email "noreply@clavik.io"
          git add Formula/clavik.rb
          git commit -m "chore: clavik ${VERSION}

          Generated from the ${TAG} release of clavik-io/clavik-cli. Checksums
          are taken from the release's own checksums.txt, after verifying that
          file against the published binaries."
          git push
